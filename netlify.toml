# Netlify builds the site from this repository on every push.
[build]
  command = "python3 scripts/build.py ."
  publish = "dist/site"
  # Skip the build (and its credits) when a push changes nothing the site is built from,
  # e.g. notes or handover docs. Exit 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src scripts content config.json netlify.toml"
